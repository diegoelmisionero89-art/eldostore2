<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELDOSTORE</title>
<meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#fff;font:16px/1.5 Arial,Helvetica,sans-serif;text-align:center}b{color:#f4c84f}a{color:#f4c84f}</style>
<script>
  /* Enlace de producto cuya página para compartir todavía no se generó
     (por ejemplo, un producto recién cargado): se abre igual su ficha. */
  (function () {
    var m = location.pathname.match(/\/p\/([^\/]+)\/?(?:index\.html)?$/);
    if (m) location.replace("/?p=" + m[1]);
  })();
</script>
</head>
<body>
<p><b>ELDOSTORE</b><br>No encontramos esta página.<br><a href="/">Ir a la tienda</a></p>
</body>
</html>
